[package]
name = "prysm-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# The community build compiles with `--no-default-features`, which drops the
# private `prysm-ee` crate entirely (dependency inversion: core never imports EE).
ee = []

[dependencies]
prysm-core = { path = "../core" }
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tower.workspace = true
serde_json.workspace = true
