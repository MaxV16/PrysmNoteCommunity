services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: prysm_note
      POSTGRES_USER: prysm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-prysm_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prysm -d prysm_note"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://prysm:${DB_PASSWORD:-prysm_dev_password}@postgres:5432/prysm_note
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: /api
      API_PROXY: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    command: npx next dev -p 3000

volumes:
  postgres_data:
