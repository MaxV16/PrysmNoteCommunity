services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: prysm_note
      POSTGRES_USER: prysm
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      # Passed to db/init-roles.sh on first init to create the RLS-enforcing
      # app/system roles (only created when the password env is provided).
      DB_APP_USER: ${DB_APP_USER:-prysm_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-}
      DB_SYSTEM_USER: ${DB_SYSTEM_USER:-prysm_system}
      DB_SYSTEM_PASSWORD: ${DB_SYSTEM_PASSWORD:-}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/db/zz-init-roles.sh:/docker-entrypoint-initdb.d/zz-init-roles.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prysm -d prysm_note"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Ephemeral rate-limit counters only — no named volume (data loss is fine).
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      # The app runs as a NON-superuser, non-BYPASSRLS role so that PostgreSQL
      # row-level security is actually enforced on its connection (not bypassed
      # like a superuser would). DB_APP_PASSWORD is stored in .env.
      DATABASE_URL: postgresql+asyncpg://${DB_APP_USER:-prysm_app}:${DB_APP_PASSWORD:?DB_APP_PASSWORD must be set in .env}@postgres:5432/prysm_note
      # System/background jobs use a BYPASSRLS non-superuser role so they can
      # process all users' data while request traffic stays under enforced RLS.
      SYSTEM_DATABASE_URL: postgresql+asyncpg://${DB_SYSTEM_USER:-prysm_system}:${DB_SYSTEM_PASSWORD:?DB_SYSTEM_PASSWORD must be set in .env}@postgres:5432/prysm_note
      PYTHONPATH: /app
      # Redis-backed rate limiting (rate-limit counters are ephemeral).
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    command: npx next dev -p 3000

volumes:
  postgres_data:
