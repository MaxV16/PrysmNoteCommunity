services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: prysm_note
      POSTGRES_USER: prysm
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      DB_APP_USER: ${DB_APP_USER:-prysm_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-}
      DB_SYSTEM_USER: ${DB_SYSTEM_USER:-prysm_system}
      DB_SYSTEM_PASSWORD: ${DB_SYSTEM_PASSWORD:-}
    ports:
      # Loopback only: a dev database must not be reachable from the LAN.
      # The host port is overridable so a local PostgreSQL already on 5432
      # does not block the stack (POSTGRES_HOST_PORT=55432).
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/db/zz-init-roles.sh:/docker-entrypoint-initdb.d/zz-init-roles.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prysm -d prysm_note"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1024M"
    command: |
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c max_connections=30

  redis:
    image: redis:7-alpine
    ports:
      # Loopback only, like postgres: dev Redis has no password. Overridable
      # for the same reason (REDIS_HOST_PORT / API_HOST_PORT).
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru

  backend:
    build:
      context: .
      dockerfile: docker/backend-rust.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_APP_USER:-prysm_app}:${DB_APP_PASSWORD:?DB_APP_PASSWORD must be set in .env}@postgres:5432/prysm_note
      SYSTEM_DATABASE_URL: postgresql+asyncpg://${DB_SYSTEM_USER:-prysm_system}:${DB_SYSTEM_PASSWORD:?DB_SYSTEM_PASSWORD must be set in .env}@postgres:5432/prysm_note
      REDIS_URL: redis://redis:6379/0
    ports:
      # Loopback only; the frontend reaches the API over the compose network.
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: "1024M"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2048M"
    command: npx next dev -p 3000

volumes:
  postgres_data:
